    @keyframes popIn {
      0% {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

    /**
     * Algoritma Fisher-Yates untuk mengacak array secara adil
     */
    function shuffleArray(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    /**
     * Mengacak pilihan jawaban di dalam setiap soal sekaligus mengacak urutan soal per bagian
     */
    function buildShuffledQuestions() {
      const cloned = JSON.parse(JSON.stringify(BASE_QUESTIONS));

      // 1. Acak pilihan jawaban / kotak kata / potongan kalimat untuk tiap soal
      cloned.forEach(q => {
        if (q.type === "single" || q.type === "multi2") {
          const letters = ["a", "b", "c", "d"];
          const correctTexts = Array.isArray(q.correct)
            ? q.correct.map(k => q.options.find(o => o.key === k).text)
            : [q.options.find(o => o.key === q.correct).text];

          const shuffledOpts = shuffleArray(q.options).map((opt, idx) => ({
            ...opt,
            key: letters[idx]
          }));

          q.options = shuffledOpts;
          if (q.type === "single") {
            const found = shuffledOpts.find(o => correctTexts.includes(o.text));
            q.correct = found ? found.key : "a";
          } else {
            q.correct = shuffledOpts
              .filter(o => correctTexts.includes(o.text))
              .map(o => o.key);
          }
        } else if (q.type === "fill_word" || q.type === "pinyin_hanzi") {
          q.wordBank = shuffleArray(q.wordBank);
        } else if (q.type === "order") {
          let shuffledTiles = shuffleArray(q.tiles);
          // Pastikan susunan awal tidak langsung membentuk jawaban benar
          if (q.correctList.includes(shuffledTiles.join("")) && shuffledTiles.length > 1) {
            shuffledTiles.push(shuffledTiles.shift());
          }
          q.tiles = shuffledTiles;
        }
      });

      // 2. Acak urutan soal per bagian (Section I - V)
      const sec1All = cloned.filter(q => q.section === "I. Pilihan Ganda");
      const text1Group = shuffleArray(sec1All.filter(q => q.passageKey === "text1"));
      const text2Group = shuffleArray(sec1All.filter(q => q.passageKey === "text2"));
      const text3Group = shuffleArray(sec1All.filter(q => q.passageKey === "text3"));
      const shuffledReadingBlocks = shuffleArray([text1Group, text2Group, text3Group]).flat();
      const sec1Standalone = shuffleArray(sec1All.filter(q => !q.passageKey));

      const sec2 = shuffleArray(cloned.filter(q => q.section === "II. PG Kompleks (2 Jawaban)"));
      const sec3 = shuffleArray(cloned.filter(q => q.section === "III. Isian Melengkapi Kalimat"));
      const sec4 = shuffleArray(cloned.filter(q => q.section === "IV. Pilih Hanzi Sesuai Pinyin"));
      const sec5 = shuffleArray(cloned.filter(q => q.section === "V. Susun Kalimat (连词成句)"));

      // 3. Gabungkan seluruh bagian dan beri nomor urut baru 1 - 40
      const combined = [
        ...shuffledReadingBlocks,
        ...sec1Standalone,
        ...sec2,
        ...sec3,
        ...sec4,
        ...sec5
      ];

      return combined.map((q, idx) => ({
        ...q,
        id: idx + 1
      }));
    }

    // ==================== STATE APLIKASI ====================
    let QUESTIONS = buildShuffledQuestions();
    let currentIndex = 0; // Indeks soal aktif (0 - 39)
    let isReviewMode = false; // Apakah sedang di layar Review & Koreksi
    let showPinyinHelper = false; // Bantuan baca Pinyin per soal (default false agar anak melatih membaca Hanzi)
    let userAnswers = {}; // Menyimpan jawaban murid berdasarkan question.id

    // ==================== FUNGSI BANTUAN & AUDIO ====================
    function showToast(msg, icon = "💡") {
      const toast = document.getElementById("toastBox");
      document.getElementById("toastMsg").textContent = msg;
      document.getElementById("toastIcon").textContent = icon;
      toast.classList.remove("translate-y-20", "opacity-0");
      toast.classList.add("translate-y-0", "opacity-100");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.add("translate-y-20", "opacity-0");
        toast.classList.remove("translate-y-0", "opacity-100");
      }, 2600);
    }

    // Fitur pengucapan Mandarin (Web Speech API) untuk melatih membaca karakter
    function speakMandarin(text) {
      try {
        if (!("speechSynthesis" in window)) {
          showToast("Perangkat ini belum mendukung suara Mandarin otomatis.", "🔇");
          return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "zh-CN";
        utterance.rate = 0.85; // Sedikit lambat agar jelas untuk anak kelas 4 SD
        window.speechSynthesis.speak(utterance);
        showToast("Membacakan Hanzi dengan suara...", "🔊");
      } catch (e) {
        showToast("Suara tidak dapat diputar di browser ini.", "🔇");
      }
    }

    function toggleMobileMenu() {
      const sidebar = document.getElementById("leftSidebar");
      const backdrop = document.getElementById("sidebarBackdrop");
      const isClosed = sidebar.classList.contains("-translate-x-full");
      if (isClosed) {
        sidebar.classList.remove("-translate-x-full");
        backdrop.classList.remove("hidden");
      } else {
        sidebar.classList.add("-translate-x-full");
        backdrop.classList.add("hidden");
      }
    }

    function closeMobileMenuIfOpen() {
      const sidebar = document.getElementById("leftSidebar");
      const backdrop = document.getElementById("sidebarBackdrop");
      if (!sidebar.classList.contains("-translate-x-full")) {
        sidebar.classList.add("-translate-x-full");
        backdrop.classList.add("hidden");
      }
    }

    // ==================== EVALUASI JAWABAN ====================
    function isQuestionAnswered(q) {
      const ans = userAnswers[q.id];
      if (ans === undefined || ans === null) return false;
      if (q.type === "multi2") return Array.isArray(ans) && ans.length === 2;
      if (q.type === "order") return Array.isArray(ans) && ans.length === q.tiles.length;
      return String(ans).trim().length > 0;
    }

    function isQuestionCorrect(q) {
      const ans = userAnswers[q.id];
      if (!isQuestionAnswered(q)) return false;

      if (q.type === "single" || q.type === "fill_word" || q.type === "pinyin_hanzi") {
        return ans === q.correct;
      }
      if (q.type === "multi2") {
        const sortedUser = [...ans].sort().join(",");
        const sortedCorrect = [...q.correct].sort().join(",");
        return sortedUser === sortedCorrect;
      }
      if (q.type === "order") {
        const joined = ans.join("");
        return q.correctList.includes(joined);
      }
      return false;
    }

    function updateHeaderProgress() {
      const answeredCount = QUESTIONS.filter(q => isQuestionAnswered(q)).length;
      const pct = Math.round((answeredCount / QUESTIONS.length) * 100);
      document.getElementById("headerProgressText").textContent = `${answeredCount} / ${QUESTIONS.length} Soal`;
      document.getElementById("topProgressBar").style.width = `${pct}%`;
    }

    // ==================== RENDER MENU KIRI ====================
    function renderLeftMenu() {
      const container = document.getElementById("questionMenuContainer");
      // Kelompokkan soal berdasarkan section
      const groups = [];
      QUESTIONS.forEach((q, idx) => {
        let g = groups.find(item => item.section === q.section);
        if (!g) {
          g = { section: q.section, items: [] };
          groups.push(g);
        }
        g.items.push({ q, idx });
      });

      container.innerHTML = groups.map(group => `
        <div class="bg-amber-50/60 p-3 rounded-2xl border border-amber-200/80">
          <div class="text-xs font-black text-amber-900 mb-2 tracking-wide">
            ${group.section}
          </div>
          <div class="grid grid-cols-5 gap-2">
            ${group.items.map(({ q, idx }) => {
              const isCurrent = !isReviewMode && idx === currentIndex;
              const answered = isQuestionAnswered(q);
              let btnClass = "bg-white text-slate-700 border-2 border-slate-200 hover:border-amber-400";

              if (isCurrent) {
                btnClass = "bg-orange-500 text-white border-2 border-orange-700 ring-2 ring-amber-300 scale-105 shadow-md";
              } else if (answered) {
                btnClass = "bg-sky-500 text-white border-2 border-sky-600 shadow-xs";
              }

              return `
                <button
                  onclick="selectQuestion(${idx})"
                  class="h-10 rounded-xl font-black text-sm transition-all active:scale-95 flex items-center justify-center cursor-pointer ${btnClass}"
                  title="Soal No. ${q.id}"
                >
                  ${q.id}
                </button>
              `;
            }).join("")}
          </div>
        </div>
      `).join("");
    }

    // ==================== NAVIGASI SOAL (1 LAYAR 1 SOAL) ====================
    function selectQuestion(idx) {
      currentIndex = idx;
      isReviewMode = false;
      showPinyinHelper = false;
      closeMobileMenuIfOpen();
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        selectQuestion(currentIndex - 1);
      }
    }

    function nextQuestion() {
      if (currentIndex < QUESTIONS.length - 1) {
        selectQuestion(currentIndex + 1);
      } else {
        openReviewView();
      }
    }

    function togglePinyinHelper() {
      showPinyinHelper = !showPinyinHelper;
      renderSingleQuestion();
    }

    // ==================== HANDLER INTERAKSI JAWABAN ====================
    function handleSingleSelect(qId, value) {
      userAnswers[qId] = value;
      renderAll();
    }

    function handleMulti2Toggle(qId, optionKey) {
      let current = Array.isArray(userAnswers[qId]) ? [...userAnswers[qId]] : [];
      if (current.includes(optionKey)) {
        current = current.filter(k => k !== optionKey);
      } else {
        if (current.length >= 2) {
          showToast("Maksimal pilih 2 jawaban ya! Hapus salah satu dulu jika ingin ganti.", "✌️");
          return;
        }
        current.push(optionKey);
      }
      userAnswers[qId] = current;
      renderAll();
    }

    function handleOrderAddTile(qId, tileIdx) {
      const q = QUESTIONS.find(item => item.id === qId);
      let selectedIndices = Array.isArray(userAnswers[qId + "_idx"]) ? [...userAnswers[qId + "_idx"]] : [];
      if (!selectedIndices.includes(tileIdx)) {
        selectedIndices.push(tileIdx);
        userAnswers[qId + "_idx"] = selectedIndices;
        userAnswers[qId] = selectedIndices.map(i => q.tiles[i]);
        renderAll();
      }
    }

    function handleOrderRemoveAt(qId, posIdx) {
      const q = QUESTIONS.find(item => item.id === qId);
      let selectedIndices = Array.isArray(userAnswers[qId + "_idx"]) ? [...userAnswers[qId + "_idx"]] : [];
      selectedIndices.splice(posIdx, 1);
      userAnswers[qId + "_idx"] = selectedIndices;
      userAnswers[qId] = selectedIndices.map(i => q.tiles[i]);
      renderAll();
    }

    function handleOrderReset(qId) {
      userAnswers[qId + "_idx"] = [];
      userAnswers[qId] = [];
      renderAll();
    }

    // ==================== RENDER 1 LAYAR 1 SOAL ====================

      if (passage) {
        passageHtml = `

            const uOpt = q.options.find(o => o.key === uKey);
            userAnsDisplay = `<span class="uppercase font-sans font-black mr-1">${uKey}.</span> <span class="font-fzkai text-2xl">${uOpt.text}</span> <span class="text-xs text-slate-500">(${uOpt.pinyin} - ${uOpt.meaning})</span>`;

              const o = q.options.find(item => item.key === k);

            return `<span class="inline-block mr-3"><b class="uppercase font-sans">${k}.</b> <span class="font-fzkai text-xl">${o.text}</span> <span class="text-xs">(${o.pinyin})</span></span>`;
          }).join(" & ");
        } else if (q.type === "fill_word") {
          questionTextDisplay = `${q.sentenceBefore}【 ____ 】${q.sentenceAfter}`;
          if (userAnswers[q.id]) {
            userAnsDisplay = `<span class="font-fzkai text-2xl font-bold">${userAnswers[q.id]}</span>`;
          }
          const wb = q.wordBank.find(w => w.hanzi === q.correct);
          correctAnsDisplay = `<span class="font-fzkai text-2xl font-bold">${q.correct}</span> <span class="text-xs text-emerald-700">(${wb ? wb.pinyin + " - " + wb.meaning : ""})</span>`;
        } else if (q.type === "pinyin_hanzi") {
          questionTextDisplay = `Pinyin: <span class="font-sans font-black text-indigo-700">${q.targetPinyin}</span>`;
          if (userAnswers[q.id]) {
            userAnsDisplay = `<span class="font-fzkai text-2xl font-bold">${userAnswers[q.id]}</span>`;
          }
          const wb = q.wordBank.find(w => w.hanzi === q.correct);
          correctAnsDisplay = `<span class="font-fzkai text-2xl font-bold">${q.correct}</span> <span class="text-xs text-emerald-700">(${wb ? wb.meaning : ""})</span>`;
        } else if (q.type === "order") {
          questionTextDisplay = `Susun kata: <span class="font-fzkai text-xl">${q.tiles.join(" / ")}</span>`;
          if (answered) {
            userAnsDisplay = `<span class="font-fzkai text-2xl font-bold">${userAnswers[q.id].join("")}${q.endPunctuation}</span>`;
          }
          correctAnsDisplay = `<span class="font-fzkai text-2xl font-bold">${q.displayAnswer}</span> <span class="text-xs text-emerald-700">(${q.qPinyin})</span>`;
        }

        const cardBorder = !answered
          ? "border-slate-200 bg-white"
          : correct
            ? "border-emerald-300 bg-emerald-50/40"
            : "border-rose-300 bg-rose-50/40";

        const statusBadge = !answered
          ? `<span class="px-3 py-1 rounded-full bg-slate-200 text-slate-700 text-xs font-black">⚪ Kosong</span>`
          : correct
            ? `<span class="px-3 py-1 rounded-full bg-emerald-500 text-white text-xs font-black">✅ Benar</span>`
            : `<span class="px-3 py-1 rounded-full bg-rose-500 text-white text-xs font-black">❌ Perlu Koreksi</span>`;

        return `
          <div class="p-4 sm:p-5 rounded-3xl border-2 ${cardBorder} shadow-xs">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
              <div class="flex items-center gap-2">
                <span class="w-8 h-8 rounded-xl bg-amber-500 text-white font-black text-sm flex items-center justify-center">
                  ${q.id}
                </span>
                <span class="text-xs font-extrabold text-slate-500">${q.section}</span>
                ${statusBadge}
              </div>

              <button
                onclick="selectQuestion(${idx})"
                class="px-3 py-1.5 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-900 font-extrabold text-xs cursor-pointer"
              >
                ✏️ Buka Soal No. ${q.id}
              </button>
            </div>

            <!-- Pertanyaan dalam Font FZKai -->
            <div class="font-fzkai text-2xl sm:text-3xl font-bold text-slate-900 my-2">
              ${questionTextDisplay}
            </div>
            <div class="text-xs text-slate-500 mb-3">
              ${q.qPinyin ? `<span class="font-bold text-amber-800">${q.qPinyin}</span> • ` : ""}${q.qMeaning || ""}
            </div>

            <!-- Kotak Perbandingan Jawaban Murid vs Jawaban Benar -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
              <div class="p-3 rounded-2xl bg-white border ${correct ? "border-emerald-200" : "border-rose-200"}">
                <div class="text-xs font-extrabold text-slate-500 mb-1">Jawaban Kamu:</div>
                <div class="${correct ? "text-emerald-800" : "text-rose-700"} font-bold">
                  ${userAnsDisplay}
                </div>
              </div>

              <div class="p-3 rounded-2xl bg-emerald-50 border border-emerald-300">
                <div class="text-xs font-extrabold text-emerald-800 mb-1">✅ Jawaban Benar (Koreksi):</div>
                <div class="text-emerald-950 font-bold">
                  ${correctAnsDisplay}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join("");

      reviewStage.innerHTML = `
        <div class="bg-white rounded-3xl shadow-xl border-4 border-emerald-200 p-4 sm:p-7 animate-pop space-y-6">
          <!-- Ringkasan Skor Anak -->
          <div class="bg-gradient-to-r from-emerald-500 via-teal-500 to-sky-500 text-white rounded-3xl p-5 sm:p-7 shadow-md flex flex-col sm:flex-row items-center justify-between gap-5">
            <div>
              <span class="inline-block px-3 py-1 rounded-full bg-white/20 text-xs font-black mb-2">
                📊 Hasil Review & Koreksi Belajar Hanzi
              </span>
              <h2 class="text-2xl sm:text-3xl font-black">${praiseTitle}</h2>
              <p class="text-sm text-emerald-50 font-semibold mt-1">${praiseSub}</p>
              <div class="mt-4 flex flex-wrap gap-2">
                <button
                  onclick="selectQuestion(0)"
                  class="px-4 py-2 rounded-2xl bg-white text-teal-800 hover:bg-amber-50 font-black text-xs sm:text-sm shadow-xs cursor-pointer"
                >
                  ⬅ Kembali ke Soal No. 1
                </button>
                <button
                  onclick="resetAllAnswers()"
                  class="px-4 py-2 rounded-2xl bg-rose-500 hover:bg-rose-600 text-white font-black text-xs sm:text-sm shadow-xs cursor-pointer"
                >
                  🔄 Ulangi Latihan dari Awal
                </button>
              </div>
            </div>

            <div class="bg-white text-slate-900 rounded-3xl p-5 text-center min-w-[160px] shadow-lg border-4 border-amber-300 shrink-0">
              <div class="text-xs font-extrabold text-slate-500 uppercase">Nilai Akhir</div>
              <div class="text-5xl font-black text-emerald-600 my-1">${score}</div>
              <div class="text-xs font-extrabold text-slate-700">
                Benar <span class="text-emerald-600">${correctCount}</span> dari ${QUESTIONS.length} Soal
              </div>
            </div>
          </div>

          <!-- Daftar Seluruh 40 Soal + Jawaban Benar -->
          <div>
            <h3 class="text-lg sm:text-xl font-black text-slate-800 mb-3 flex items-center gap-2">
              <span>📝</span> Pembahasan Seluruh Soal & Kunci Jawaban (Font FZKai)
            </h3>
            <div class="space-y-4">
              ${cardsHtml}
            </div>
          </div>
        </div>
      `;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function resetAllAnswers() {
      QUESTIONS = buildShuffledQuestions();
      userAnswers = {};
      currentIndex = 0;
      isReviewMode = false;
      showPinyinHelper = false;
      renderAll();
      showToast("Soal & jawaban telah diacak ulang. Selamat berlatih!", "🔀");
    }

    function renderAll() {
      updateHeaderProgress();
      renderLeftMenu();
      if (isReviewMode) {
        openReviewView();
      } else {
        renderSingleQuestion();
      }
    }

    // Inisialisasi aplikasi saat halaman selesai dimuat
    window.addEventListener("DOMContentLoaded", () => {
      renderAll();
    });
  </script>
</body>
</html>
